# DeskPilot web server: the React build plus a reverse proxy to the API, on one origin
# (so the browser never needs CORS).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API: forwarded to FastAPI inside the Compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # No strict CSP here: Swagger UI (/api/v1/docs) loads its own scripts.
        include snippets/base-headers.conf;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/app-headers.conf;
    }

    # Single-page app: unknown paths serve index.html; the router takes it from there.
    location / {
        try_files $uri /index.html;
        # Always revalidate index.html, so a new deploy is picked up right away.
        add_header Cache-Control "no-cache" always;
        include snippets/app-headers.conf;
    }
}
