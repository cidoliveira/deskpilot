# Production-like stack: docker compose -f docker-compose.prod.yml up -d --build
#
#   web (Nginx: React build + /api proxy)  ->  api (FastAPI)  ->  db
#
# Differences from the development docker-compose.yml:
# - images without dev dependencies, no source bind mounts, no auto-reload
# - migrations run once in the `migrate` service; the API starts only if they succeed
# - only the web server is published; the API and the database stay inside the network
# - the API trusts X-Forwarded-For only from Nginx's fixed address on the internal network
name: deskpilot-prod

x-backend: &backend
  build:
    context: ./backend
    target: prod
  env_file: .env
  environment:
    ENVIRONMENT: production
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    FORWARDED_ALLOW_IPS: 172.28.0.10 # the web (Nginx) container, see networks below
  networks: [internal]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deskpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.scripts.create_admin"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      internal:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
